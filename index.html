<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Site marks.

      All three point at the circular platform logo in public/. The .ico
      carries the packed small sizes a browser tab wants, so it is used
      for the favicon; the .png is the single-resolution artwork and
      serves the home screen icon and link previews, where there is room
      for it to be read properly.
    -->
    <link rel="icon" href="/clean-bharat-logo-preview.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/clean-bharat-logo-preview.png" />

    <title>Clean Bharat | Community Waste Reporting</title>

    <meta
      name="description"
      content="Report waste in your neighbourhood, follow the cleanup, and see the before and after. A community run waste reporting platform."
    />

    <!-- Carries the platform mark into shared links -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clean Bharat | Community Waste Reporting" />
    <meta
      property="og:description"
      content="Report waste in your neighbourhood, follow the cleanup, and see the before and after."
    />
    <meta property="og:image" content="/clean-bharat-logo-preview.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Tints the browser chrome on mobile to match the masthead -->
    <meta name="theme-color" content="#0b2b4e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
