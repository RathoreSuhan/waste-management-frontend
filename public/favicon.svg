<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon - Clean Bharat

  A small, hand-drawn rendition of public/logo.svg rather than the file
  itself: logo.svg is a traced raster of ~1.4 MB across 1,976 paths, which
  would be fetched on every page load and would render as an unreadable
  smudge at 16px. This keeps the same marks as the full logo - navy disc,
  green leaf, saffron sweep - at a size that stays legible in a tab strip.

  Colours match the brand tokens in src/index.css
  (--color-gov-navy, --color-india-green, --color-saffron).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Clean Bharat">

  <!-- Navy disc with a white field inside, as on the full logo -->
  <circle cx="16" cy="16" r="15" fill="#0b2b4e"/>
  <circle cx="16" cy="16" r="11.5" fill="#ffffff"/>

  <!-- Leaf - the environmental half of the mark, legible down to 16px -->
  <path d="M16 6.5c5.4 3.2 6.2 9.4 0 15-6.2-5.6-5.4-11.8 0-15z" fill="#138808"/>

  <!-- Midrib, so the shape reads as a leaf rather than a droplet -->
  <path d="M16 8.6v12" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Saffron sweep - the cleaning half -->
  <path d="M7.4 20.4Q16 27 24.6 20.4" fill="none" stroke="#ff9933" stroke-width="2.2" stroke-linecap="round"/>
</svg>
